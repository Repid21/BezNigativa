name: Add Movement Modules

on:
  push:
    paths:
      - '.github/workflows/add-movement-modules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Movement modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.lua')
          s = p.read_text(encoding='utf-8')
          start = s.index('-- MOVEMENT')
          end = s.index('-- COMBAT / SAFE CAMERA ASSIST')

          movement = r'''-- MOVEMENT
          pageTitle(MovementPage, "Movement", safeEnvironment and "Enabled in this test environment" or "Locked: Studio / your private server only")

          local speedEnabled = false
          local jumpEnabled = false
          local noclipEnabled = false
          local flyEnabled = false
          local speedValue = 24
          local jumpValue = 70
          local flySpeed = 45
          local defaults = {WalkSpeed = 16, JumpPower = 50, JumpHeight = 7.2}
          local noclipOriginalCollide = {}

          local function getHumanoid()
              local character = LocalPlayer.Character
              return character and character:FindFirstChildOfClass("Humanoid")
          end

          local function getRoot()
              local character = LocalPlayer.Character
              return character and character:FindFirstChild("HumanoidRootPart")
          end

          local function restoreNoclip()
              for part, oldValue in pairs(noclipOriginalCollide) do
                  if part and part.Parent then
                      pcall(function() part.CanCollide = oldValue end)
                  end
              end
              table.clear(noclipOriginalCollide)
          end

          local function setFlyState(enabled)
              local humanoid = getHumanoid()
              local root = getRoot()
              if humanoid then
                  humanoid.PlatformStand = enabled
              end
              if root and not enabled then
                  root.AssemblyLinearVelocity = Vector3.zero
                  root.AssemblyAngularVelocity = Vector3.zero
              end
          end

          local function captureDefaults()
              local humanoid = getHumanoid()
              if humanoid then
                  defaults.WalkSpeed = humanoid.WalkSpeed
                  defaults.JumpPower = humanoid.JumpPower
                  defaults.JumpHeight = humanoid.JumpHeight
              end
          end

          captureDefaults()
          bind(LocalPlayer.CharacterAdded:Connect(function()
              restoreNoclip()
              task.wait(0.2)
              captureDefaults()
              if flyEnabled and safeEnvironment then
                  setFlyState(true)
              end
          end))

          local speedToggle = createToggle(MovementPage, 18, 78, 190, "Speed", false, function(value)
              if value and not safeEnvironment then return false end
              speedEnabled = value
              local humanoid = getHumanoid()
              if humanoid and not value then humanoid.WalkSpeed = defaults.WalkSpeed end
          end)

          local jumpToggle = createToggle(MovementPage, 222, 78, 190, "Jump", false, function(value)
              if value and not safeEnvironment then return false end
              jumpEnabled = value
              local humanoid = getHumanoid()
              if humanoid and not value then
                  if humanoid.UseJumpPower then humanoid.JumpPower = defaults.JumpPower else humanoid.JumpHeight = defaults.JumpHeight end
              end
          end)

          local noclipToggle = createToggle(MovementPage, 18, 122, 190, "NoClip", false, function(value)
              if value and not safeEnvironment then return false end
              noclipEnabled = value
              if not value then
                  restoreNoclip()
              end
          end)

          local flyToggle = createToggle(MovementPage, 222, 122, 190, "Fly", false, function(value)
              if value and not safeEnvironment then return false end
              flyEnabled = value
              setFlyState(value)
          end)

          local getSpeed = createStepper(MovementPage, 174, "Speed value", speedValue, 16, 100, 4, function(v) speedValue = v end)
          local getJump = createStepper(MovementPage, 216, "Jump value", jumpValue, 30, 150, 5, function(v) jumpValue = v end)
          local getFlySpeed = createStepper(MovementPage, 258, "Fly speed", flySpeed, 10, 200, 5, function(v) flySpeed = v end)

          local flyHint = Instance.new("TextLabel")
          flyHint.BackgroundTransparency = 1
          flyHint.Position = UDim2.fromOffset(18, 306)
          flyHint.Size = UDim2.new(1, -36, 0, 42)
          flyHint.Font = Enum.Font.Code
          flyHint.Text = "Fly controls: WASD | Space: up | LeftCtrl: down"
          flyHint.TextColor3 = Color3.fromRGB(140, 140, 140)
          flyHint.TextSize = 12
          flyHint.TextWrapped = true
          flyHint.TextXAlignment = Enum.TextXAlignment.Left
          flyHint.TextYAlignment = Enum.TextYAlignment.Top
          flyHint.Parent = MovementPage

          local function updateNoclip()
              if not noclipEnabled or not safeEnvironment then return end
              local character = LocalPlayer.Character
              if not character then return end

              for _, object in ipairs(character:GetDescendants()) do
                  if object:IsA("BasePart") then
                      if noclipOriginalCollide[object] == nil then
                          noclipOriginalCollide[object] = object.CanCollide
                      end
                      object.CanCollide = false
                  end
              end
          end

          local function updateFly()
              if not flyEnabled or not safeEnvironment then return end

              local humanoid = getHumanoid()
              local root = getRoot()
              Camera = workspace.CurrentCamera or Camera
              if not humanoid or not root or not Camera then return end

              if not humanoid.PlatformStand then
                  humanoid.PlatformStand = true
              end

              local look = Camera.CFrame.LookVector
              local right = Camera.CFrame.RightVector
              local forward = Vector3.new(look.X, 0, look.Z)
              local strafe = Vector3.new(right.X, 0, right.Z)

              if forward.Magnitude > 0.001 then forward = forward.Unit end
              if strafe.Magnitude > 0.001 then strafe = strafe.Unit end

              local direction = Vector3.zero
              if UserInputService:IsKeyDown(Enum.KeyCode.W) then direction += forward end
              if UserInputService:IsKeyDown(Enum.KeyCode.S) then direction -= forward end
              if UserInputService:IsKeyDown(Enum.KeyCode.D) then direction += strafe end
              if UserInputService:IsKeyDown(Enum.KeyCode.A) then direction -= strafe end
              if UserInputService:IsKeyDown(Enum.KeyCode.Space) then direction += Vector3.yAxis end
              if UserInputService:IsKeyDown(Enum.KeyCode.LeftControl) then direction -= Vector3.yAxis end

              if direction.Magnitude > 0.001 then
                  direction = direction.Unit
              end

              root.AssemblyLinearVelocity = direction * flySpeed
              root.AssemblyAngularVelocity = Vector3.zero
          end

          local function updateMovement()
              if not safeEnvironment then return end
              local humanoid = getHumanoid()
              if humanoid then
                  if speedEnabled then humanoid.WalkSpeed = speedValue end
                  if jumpEnabled then
                      if humanoid.UseJumpPower then humanoid.JumpPower = jumpValue else humanoid.JumpHeight = math.max(7.2, jumpValue / 10) end
                  end
              end
              updateNoclip()
              updateFly()
          end

          '''

          s = s[:start] + movement + s[end:]

          old_cleanup = '''    local humanoid = getHumanoid()\n    if humanoid then\n        pcall(function() humanoid.WalkSpeed = defaults.WalkSpeed end)\n        pcall(function()\n            if humanoid.UseJumpPower then humanoid.JumpPower = defaults.JumpPower else humanoid.JumpHeight = defaults.JumpHeight end\n        end)\n    end\n'''
          new_cleanup = '''    local humanoid = getHumanoid()\n    if humanoid then\n        pcall(function() humanoid.WalkSpeed = defaults.WalkSpeed end)\n        pcall(function()\n            if humanoid.UseJumpPower then humanoid.JumpPower = defaults.JumpPower else humanoid.JumpHeight = defaults.JumpHeight end\n        end)\n        pcall(function() humanoid.PlatformStand = false end)\n    end\n\n    local root = getRoot()\n    if root then\n        pcall(function() root.AssemblyLinearVelocity = Vector3.zero end)\n        pcall(function() root.AssemblyAngularVelocity = Vector3.zero end)\n    end\n    restoreNoclip()\n'''
          if old_cleanup not in s:
              raise SystemExit('cleanup block not found')
          s = s.replace(old_cleanup, new_cleanup, 1)
          p.write_text(s, encoding='utf-8')

          r = Path('README.md')
          if r.exists():
              text = r.read_text(encoding='utf-8')
              text = text.replace('- `Jump` — тест изменения JumpPower / JumpHeight.\n- Значения меняются кнопками `-` и `+`.', '- `Jump` — тест изменения JumpPower / JumpHeight.\n- `NoClip` — отключает коллизии персонажа.\n- `Fly` — полёт с регулируемой скоростью (`WASD`, `Space`, `LeftCtrl`).\n- Значения меняются кнопками `-` и `+`.')
              r.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua README.md
          git commit -m "Add NoClip and Fly movement modules"
          git push
