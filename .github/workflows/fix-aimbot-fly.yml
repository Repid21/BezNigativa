name: Fix AimBot and Fly

on:
  push:
    paths:
      - '.github/workflows/fix-aimbot-fly.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.lua
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.lua')
          s = p.read_text(encoding='utf-8')

          s = s.replace('-- All features are enabled everywhere.', '-- Movement and Combat are limited to Studio or an experience owned by LocalPlayer.')

          anchor = '''if not LocalPlayer then
              warn("[BezNigativa] LocalPlayer not found")
              return
          end

          local env = (getgenv and getgenv()) or _G'''
          repl = '''if not LocalPlayer then
              warn("[BezNigativa] LocalPlayer not found")
              return
          end

          local safeEnvironment = RunService:IsStudio()
              or (game.CreatorType == Enum.CreatorType.User and game.CreatorId == LocalPlayer.UserId)

          local env = (getgenv and getgenv()) or _G'''
          if anchor not in s:
              raise SystemExit('safeEnvironment anchor not found')
          s = s.replace(anchor, repl, 1)

          s = s.replace('pageTitle(MovementPage, "Movement", "All features enabled")', 'pageTitle(MovementPage, "Movement", safeEnvironment and "Enabled in this test environment" or "Locked: Studio / your own place only")', 1)

          s = s.replace('''    if flyEnabled then
                  setFlyState(true)
              end''', '''    if flyEnabled and safeEnvironment then
                  setFlyState(true)
              end''', 1)

          s = s.replace('''local speedToggle = createToggle(MovementPage, 18, 78, 190, "Speed", false, function(value)
              speedEnabled = value''', '''local speedToggle = createToggle(MovementPage, 18, 78, 190, "Speed", false, function(value)
              if value and not safeEnvironment then return false end
              speedEnabled = value''', 1)

          s = s.replace('''local jumpToggle = createToggle(MovementPage, 222, 78, 190, "Jump", false, function(value)
              jumpEnabled = value''', '''local jumpToggle = createToggle(MovementPage, 222, 78, 190, "Jump", false, function(value)
              if value and not safeEnvironment then return false end
              jumpEnabled = value''', 1)

          s = s.replace('''local noclipToggle = createToggle(MovementPage, 18, 122, 190, "NoClip", false, function(value)
              noclipEnabled = value''', '''local noclipToggle = createToggle(MovementPage, 18, 122, 190, "NoClip", false, function(value)
              if value and not safeEnvironment then return false end
              noclipEnabled = value''', 1)

          s = s.replace('''local flyToggle = createToggle(MovementPage, 222, 122, 190, "Fly", false, function(value)
              flyEnabled = value''', '''local flyToggle = createToggle(MovementPage, 222, 122, 190, "Fly", false, function(value)
              if value and not safeEnvironment then return false end
              flyEnabled = value''', 1)

          s = s.replace('if not noclipEnabled then return end', 'if not noclipEnabled or not safeEnvironment then return end', 1)
          s = s.replace('if not flyEnabled then return end', 'if not flyEnabled or not safeEnvironment then return end', 1)

          old_fly_vectors = '''    local look = Camera.CFrame.LookVector
              local right = Camera.CFrame.RightVector
              local forward = Vector3.new(look.X, 0, look.Z)
              local strafe = Vector3.new(right.X, 0, right.Z)

              if forward.Magnitude > 0.001 then forward = forward.Unit end
              if strafe.Magnitude > 0.001 then strafe = strafe.Unit end'''
          new_fly_vectors = '''    local look = Camera.CFrame.LookVector
              local right = Camera.CFrame.RightVector

              -- W/S follow the full camera look direction, including pitch.
              local forward = look.Magnitude > 0.001 and look.Unit or Vector3.new(0, 0, -1)
              local strafe = right.Magnitude > 0.001 and right.Unit or Vector3.new(1, 0, 0)'''
          if old_fly_vectors not in s:
              raise SystemExit('fly vector block not found')
          s = s.replace(old_fly_vectors, new_fly_vectors, 1)

          s = s.replace('''    local face = forward
              if face.Magnitude <= 0.001 then
                  face = Vector3.new(root.CFrame.LookVector.X, 0, root.CFrame.LookVector.Z)
              end''', '''    local face = Vector3.new(look.X, 0, look.Z)
              if face.Magnitude <= 0.001 then
                  face = Vector3.new(root.CFrame.LookVector.X, 0, root.CFrame.LookVector.Z)
              end''', 1)

          s = s.replace('''local function updateMovement()
              local humanoid = getHumanoid()''', '''local function updateMovement()
              if not safeEnvironment then return end
              local humanoid = getHumanoid()''', 1)

          s = s.replace('pageTitle(CombatPage, "Combat", "AimBot | first person")', 'pageTitle(CombatPage, "Combat", safeEnvironment and "AimBot test | first person" or "Locked: Studio / your own place only")', 1)

          s = s.replace('''local cameraToggle = createToggle(CombatPage, 18, 78, 190, "AimBot", false, function(value)
              cameraAssistEnabled = value''', '''local cameraToggle = createToggle(CombatPage, 18, 78, 190, "AimBot", false, function(value)
              if value and not safeEnvironment then return false end
              cameraAssistEnabled = value''', 1)

          s = s.replace('combatStatus.Text = "Enter first person to use AimBot"', 'combatStatus.Text = safeEnvironment and "Enter first person to use AimBot" or "AimBot disabled outside your test environment"', 1)

          old_first = '''local function isFirstPerson()
              if not Camera then return false end
              return (Camera.CFrame.Position - Camera.Focus.Position).Magnitude < 1.2
          end'''
          new_first = '''local function isFirstPerson()
              if not Camera then return false end

              if LocalPlayer.CameraMode == Enum.CameraMode.LockFirstPerson then
                  return true
              end

              local character = LocalPlayer.Character
              local head = character and character:FindFirstChild("Head")
              if head and head:IsA("BasePart") then
                  return (Camera.CFrame.Position - head.Position).Magnitude < 1.5
              end

              return false
          end'''
          if old_first not in s:
              raise SystemExit('first person block not found')
          s = s.replace(old_first, new_first, 1)

          s = s.replace('fovCircle.Visible = cameraAssistEnabled', 'fovCircle.Visible = cameraAssistEnabled and safeEnvironment', 1)
          s = s.replace('if not cameraAssistEnabled then return end', 'if not cameraAssistEnabled or not safeEnvironment then return end', 1)

          old_loop = '''bind(RunService.RenderStepped:Connect(function()
              Camera = workspace.CurrentCamera or Camera
              updateESP()
              updateCombat()
              updateMovement()
          end))

          bind(RunService.Heartbeat:Connect(updateMovement))'''
          new_loop = '''bind(RunService.RenderStepped:Connect(function()
              Camera = workspace.CurrentCamera or Camera
              updateESP()
              updateMovement()
          end))

          -- Apply AimBot after Roblox's normal camera update so CameraScript does not overwrite it.
          local AIMBOT_RENDER_NAME = "BezNigativaAimBotCamera"
          RunService:BindToRenderStep(AIMBOT_RENDER_NAME, Enum.RenderPriority.Camera.Value + 1, function()
              Camera = workspace.CurrentCamera or Camera
              updateCombat()
          end)

          bind(RunService.Heartbeat:Connect(updateMovement))'''
          if old_loop not in s:
              raise SystemExit('main render loop not found')
          s = s.replace(old_loop, new_loop, 1)

          cleanup_anchor = '''local function cleanup()
              if destroyed then return end
              destroyed = true

              restoreNoclip()'''
          cleanup_repl = '''local function cleanup()
              if destroyed then return end
              destroyed = true

              pcall(function()
                  RunService:UnbindFromRenderStep("BezNigativaAimBotCamera")
              end)

              restoreNoclip()'''
          if cleanup_anchor not in s:
              raise SystemExit('cleanup anchor not found')
          s = s.replace(cleanup_anchor, cleanup_repl, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix AimBot camera priority and Fly direction"
          git push
