name: Fix Movement Runtime

on:
  push:
    paths:
      - '.github/workflows/fix-movement-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch movement runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.lua')
          s = p.read_text(encoding='utf-8')

          marker = '''if not LocalPlayer then
              warn("[BezNigativa] LocalPlayer not found")
              return
          end

          local env = (getgenv and getgenv()) or _G'''
          replacement = '''if not LocalPlayer then
              warn("[BezNigativa] LocalPlayer not found")
              return
          end

          -- Allow runtime-changing modules in Studio, an owned private server,
          -- or a public experience owned by the current Roblox user.
          local safeEnvironment = RunService:IsStudio()
              or (game.PrivateServerId ~= "" and game.PrivateServerOwnerId == LocalPlayer.UserId)
              or (game.CreatorType == Enum.CreatorType.User and game.CreatorId == LocalPlayer.UserId)

          local env = (getgenv and getgenv()) or _G'''
          if marker not in s:
              raise SystemExit('safeEnvironment insertion point not found')
          s = s.replace(marker, replacement, 1)

          marker = '''local defaults = {WalkSpeed = 16, JumpPower = 50, JumpHeight = 7.2}
          local noclipOriginalCollide = {}'''
          replacement = '''local defaults = {WalkSpeed = 16, JumpPower = 50, JumpHeight = 7.2}
          local noclipOriginalCollide = {}
          local flyVelocity = nil
          local flyGyro = nil
          local flyRoot = nil'''
          if marker not in s:
              raise SystemExit('fly state insertion point not found')
          s = s.replace(marker, replacement, 1)

          old = '''local function setFlyState(enabled)
              local humanoid = getHumanoid()
              local root = getRoot()
              if humanoid then
                  humanoid.PlatformStand = enabled
              end
              if root and not enabled then
                  root.AssemblyLinearVelocity = Vector3.zero
                  root.AssemblyAngularVelocity = Vector3.zero
              end
          end'''
          new = '''local function destroyFlyControllers()
              if flyVelocity then
                  pcall(function() flyVelocity:Destroy() end)
                  flyVelocity = nil
              end
              if flyGyro then
                  pcall(function() flyGyro:Destroy() end)
                  flyGyro = nil
              end
              flyRoot = nil
          end

          local function setFlyState(enabled)
              local humanoid = getHumanoid()
              local root = getRoot()

              if not enabled then
                  destroyFlyControllers()
                  if humanoid then
                      humanoid.PlatformStand = false
                      humanoid.AutoRotate = true
                      humanoid.Sit = false
                  end
                  if root then
                      root.AssemblyLinearVelocity = Vector3.zero
                      root.AssemblyAngularVelocity = Vector3.zero
                  end
                  return
              end

              if not humanoid or not root then return end

              -- PlatformStand made the avatar collapse/sit. Keep the humanoid active
              -- and use physics controllers to cancel gravity and move cleanly.
              humanoid.PlatformStand = false
              humanoid.Sit = false
              humanoid.AutoRotate = false

              if flyRoot ~= root or not flyVelocity or not flyVelocity.Parent or not flyGyro or not flyGyro.Parent then
                  destroyFlyControllers()
                  flyRoot = root

                  flyVelocity = Instance.new("BodyVelocity")
                  flyVelocity.Name = "BezNigativaFlyVelocity"
                  flyVelocity.MaxForce = Vector3.new(1e9, 1e9, 1e9)
                  flyVelocity.P = 15000
                  flyVelocity.Velocity = Vector3.zero
                  flyVelocity.Parent = root

                  flyGyro = Instance.new("BodyGyro")
                  flyGyro.Name = "BezNigativaFlyGyro"
                  flyGyro.MaxTorque = Vector3.new(1e9, 1e9, 1e9)
                  flyGyro.P = 20000
                  flyGyro.D = 700
                  flyGyro.CFrame = root.CFrame
                  flyGyro.Parent = root
              end
          end'''
          if old not in s:
              raise SystemExit('old setFlyState not found')
          s = s.replace(old, new, 1)

          old = '''local function updateFly()
              if not flyEnabled or not safeEnvironment then return end

              local humanoid = getHumanoid()
              local root = getRoot()
              Camera = workspace.CurrentCamera or Camera
              if not humanoid or not root or not Camera then return end

              if not humanoid.PlatformStand then
                  humanoid.PlatformStand = true
              end

              local look = Camera.CFrame.LookVector
              local right = Camera.CFrame.RightVector
              local forward = Vector3.new(look.X, 0, look.Z)
              local strafe = Vector3.new(right.X, 0, right.Z)

              if forward.Magnitude > 0.001 then forward = forward.Unit end
              if strafe.Magnitude > 0.001 then strafe = strafe.Unit end

              local direction = Vector3.zero
              if UserInputService:IsKeyDown(Enum.KeyCode.W) then direction += forward end
              if UserInputService:IsKeyDown(Enum.KeyCode.S) then direction -= forward end
              if UserInputService:IsKeyDown(Enum.KeyCode.D) then direction += strafe end
              if UserInputService:IsKeyDown(Enum.KeyCode.A) then direction -= strafe end
              if UserInputService:IsKeyDown(Enum.KeyCode.Space) then direction += Vector3.yAxis end
              if UserInputService:IsKeyDown(Enum.KeyCode.LeftControl) then direction -= Vector3.yAxis end

              if direction.Magnitude > 0.001 then
                  direction = direction.Unit
              end

              root.AssemblyLinearVelocity = direction * flySpeed
              root.AssemblyAngularVelocity = Vector3.zero
          end'''
          new = '''local function updateFly()
              if not flyEnabled or not safeEnvironment then return end

              local humanoid = getHumanoid()
              local root = getRoot()
              Camera = workspace.CurrentCamera or Camera
              if not humanoid or not root or not Camera then return end

              setFlyState(true)
              if not flyVelocity or not flyGyro then return end

              humanoid.PlatformStand = false
              humanoid.Sit = false
              humanoid.AutoRotate = false

              local look = Camera.CFrame.LookVector
              local right = Camera.CFrame.RightVector
              local forward = Vector3.new(look.X, 0, look.Z)
              local strafe = Vector3.new(right.X, 0, right.Z)

              if forward.Magnitude > 0.001 then forward = forward.Unit end
              if strafe.Magnitude > 0.001 then strafe = strafe.Unit end

              local direction = Vector3.zero
              if UserInputService:IsKeyDown(Enum.KeyCode.W) then direction += forward end
              if UserInputService:IsKeyDown(Enum.KeyCode.S) then direction -= forward end
              if UserInputService:IsKeyDown(Enum.KeyCode.D) then direction += strafe end
              if UserInputService:IsKeyDown(Enum.KeyCode.A) then direction -= strafe end
              if UserInputService:IsKeyDown(Enum.KeyCode.Space) then direction += Vector3.yAxis end
              if UserInputService:IsKeyDown(Enum.KeyCode.LeftControl) then direction -= Vector3.yAxis end

              if direction.Magnitude > 0.001 then
                  direction = direction.Unit
              end

              -- BodyVelocity also counters gravity, so zero input means hover.
              flyVelocity.Velocity = direction * flySpeed

              local face = forward
              if face.Magnitude <= 0.001 then
                  face = Vector3.new(root.CFrame.LookVector.X, 0, root.CFrame.LookVector.Z)
              end
              if face.Magnitude > 0.001 then
                  flyGyro.CFrame = CFrame.lookAt(root.Position, root.Position + face.Unit)
              end
          end'''
          if old not in s:
              raise SystemExit('old updateFly not found')
          s = s.replace(old, new, 1)

          old = '''if jumpEnabled then
                      if humanoid.UseJumpPower then humanoid.JumpPower = jumpValue else humanoid.JumpHeight = math.max(7.2, jumpValue / 10) end
                  end'''
          new = '''if jumpEnabled then
                      if humanoid.UseJumpPower then
                          humanoid.JumpPower = jumpValue
                      else
                          -- Convert the familiar JumpPower-like setting to a visible JumpHeight.
                          humanoid.JumpHeight = math.max(defaults.JumpHeight, (jumpValue * jumpValue) / (2 * workspace.Gravity))
                      end
                  end'''
          if old not in s:
              raise SystemExit('jump update block not found')
          s = s.replace(old, new, 1)

          old = '''bind(RunService.RenderStepped:Connect(function()
              Camera = workspace.CurrentCamera or Camera
              updateESP()
              updateCombat()
          end))

          bind(RunService.Heartbeat:Connect(updateMovement))'''
          new = '''bind(RunService.RenderStepped:Connect(function()
              Camera = workspace.CurrentCamera or Camera
              updateESP()
              updateCombat()
              -- Re-apply movement values late in the client frame as some place scripts
              -- rewrite WalkSpeed/Jump values continuously.
              updateMovement()
          end))

          bind(RunService.Heartbeat:Connect(updateMovement))'''
          if old not in s:
              raise SystemExit('main update loop not found')
          s = s.replace(old, new, 1)

          old = '''local humanoid = getHumanoid()
              if humanoid then
                  pcall(function() humanoid.WalkSpeed = defaults.WalkSpeed end)
                  pcall(function()
                      if humanoid.UseJumpPower then humanoid.JumpPower = defaults.JumpPower else humanoid.JumpHeight = defaults.JumpHeight end
                  end)
              end

              for _, connection in ipairs(connections) do'''
          new = '''restoreNoclip()
              setFlyState(false)

              local humanoid = getHumanoid()
              if humanoid then
                  pcall(function() humanoid.WalkSpeed = defaults.WalkSpeed end)
                  pcall(function()
                      if humanoid.UseJumpPower then humanoid.JumpPower = defaults.JumpPower else humanoid.JumpHeight = defaults.JumpHeight end
                  end)
              end

              for _, connection in ipairs(connections) do'''
          if old not in s:
              raise SystemExit('cleanup block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Speed Jump and Fly runtime"
          git push
