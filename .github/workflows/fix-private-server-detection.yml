name: Fix Private Server Detection

on:
  push:
    paths:
      - '.github/workflows/fix-private-server-detection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch private server detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.lua')
          s = p.read_text(encoding='utf-8')
          old = '''-- Runtime-changing modules are allowed in Studio, an owned private server,\n-- or a public experience owned by the current Roblox user.\nlocal safeEnvironment = RunService:IsStudio()\n    or (game.PrivateServerId ~= "" and game.PrivateServerOwnerId == LocalPlayer.UserId)\n    or (game.CreatorType == Enum.CreatorType.User and game.CreatorId == LocalPlayer.UserId)'''
          new = '''-- Runtime-changing modules are allowed in Studio, any actual Roblox private/reserved server,\n-- or a public experience owned by the current Roblox user. Reserved servers report\n-- PrivateServerOwnerId == 0, so checking ownership here incorrectly blocks them.\nlocal safeEnvironment = RunService:IsStudio()\n    or (game.PrivateServerId ~= "")\n    or (game.CreatorType == Enum.CreatorType.User and game.CreatorId == LocalPlayer.UserId)'''
          if old not in s:
              raise SystemExit('safeEnvironment block not found')
          s = s.replace(old, new, 1)
          s = s.replace('Locked: Studio / your private server only', 'Locked: public server')
          s = s.replace('Enabled in this test environment', 'Enabled: private/reserved test server')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git commit -m "Fix reserved private server detection"
          git push
