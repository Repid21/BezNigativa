name: Rename AimBot

on:
  push:
    paths:
      - '.github/workflows/rename-aimbot.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Camera Assist to AimBot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('main.lua', 'README.md'):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('Camera Assist', 'AimBot')
              s = s.replace('Camera assist', 'AimBot')
              s = s.replace('camera assist', 'AimBot')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit rename
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua README.md
          git commit -m "Rename Camera Assist to AimBot"
          git push
