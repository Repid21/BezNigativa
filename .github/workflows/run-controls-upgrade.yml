name: Run Controls Upgrade

on:
  push:
    paths:
      - '.github/workflows/run-controls-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute patch script
        run: python tools/upgrade_controls_config.py

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.lua
          git commit -m "Add wall check config sliders and aim speed" || exit 0
          git push
